openapi: 3.1.0
info:
  title: Qlik Sense Enterprise Qlik Sense Service About System Info API
  description: REST API for retrieving product information about a Qlik Sense site, including system details, installed components, external URLs, and third-party software information. The About Service API provides read-only endpoints that return JSON-formatted information about the Qlik Sense deployment.
  version: 2025.11.0
  contact:
    name: Qlik Support
    url: https://community.qlik.com/
  license:
    name: Proprietary
    url: https://www.qlik.com/us/legal/terms-of-use
  x-providerName: Qlik
  x-serviceName: qlik-sense-about-service
servers:
- url: https://{server}/api/about/v1
  description: About Service API via HTTPS
  variables:
    server:
      default: localhost
      description: Qlik Sense server hostname
security:
- xrfkey: []
tags:
- name: System Info
  description: Retrieve system-level information about the Qlik Sense site
paths:
  /systeminfo:
    get:
      operationId: getSystemInfo
      summary: Qlik Sense Enterprise Get system information
      description: Retrieves system information about the Qlik Sense site including the product name, version, release label, and deployment details.
      tags:
      - System Info
      parameters:
      - $ref: '#/components/parameters/XrfKeyParam'
      responses:
        '200':
          description: System information returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    SystemInfo:
      type: object
      properties:
        productName:
          type: string
          description: Name of the Qlik Sense product
        version:
          type: string
          description: Full product version string
        releaseLabel:
          type: string
          description: Release label (e.g., November 2025)
        deploymentType:
          type: string
          description: Type of deployment
        nodeType:
          type: string
          description: Type of the node providing this information (Central or Non-central)
        isMultiNode:
          type: boolean
          description: Whether this is a multi-node deployment
        isCentral:
          type: boolean
          description: Whether this node is the central node
        siteIdentifier:
          type: string
          format: uuid
          description: Unique identifier of the Qlik Sense site
    Error:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error message
  responses:
    Unauthorized:
      description: Authentication failed or Xrfkey missing/mismatched.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    XrfKeyParam:
      name: Xrfkey
      in: query
      required: true
      description: Cross-site request forgery prevention key. Must be 16 arbitrary characters matching the X-Qlik-Xrfkey header value.
      schema:
        type: string
        minLength: 16
        maxLength: 16
  securitySchemes:
    xrfkey:
      type: apiKey
      in: header
      name: X-Qlik-Xrfkey
      description: Cross-site request forgery prevention key. Must be 16 arbitrary characters and must match the Xrfkey query parameter.
