openapi: 3.2.0
info:
  title: Qlik Sense Enterprise Qlik Sense Service About Reload Task API
  description: REST API for retrieving product information about a Qlik Sense site, including system details, installed components, external URLs, and third-party software information. The About Service API provides read-only endpoints that return JSON-formatted information about the Qlik Sense deployment.
  version: 2025.11.0
  contact:
    name: Qlik Support
    url: https://community.qlik.com/
  license:
    name: Proprietary
    url: https://www.qlik.com/us/legal/terms-of-use
  x-providerName: Qlik
  x-serviceName: qlik-sense-about-service
servers:
- url: https://{server}/api/about/v1
  description: About Service API via HTTPS
  variables:
    server:
      default: localhost
      description: Qlik Sense server hostname
security:
- xrfkey: []
tags:
- name: Reload Task
  description: Manage and execute reload tasks
paths:
  /reloadtask:
    get:
      operationId: getReloadTasks
      summary: Qlik Sense Enterprise List reload tasks
      description: Retrieves a list of all reload tasks in condensed format.
      tags:
      - Reload Task
      parameters:
      - $ref: '#/components/parameters/XrfKeyParam'
      - $ref: '#/components/parameters/FilterParam'
      - $ref: '#/components/parameters/PrivilegesParam'
      responses:
        '200':
          description: List of reload tasks returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReloadTaskCondensed'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createReloadTask
      summary: Qlik Sense Enterprise Create reload task
      description: Creates a new reload task for an application.
      tags:
      - Reload Task
      parameters:
      - $ref: '#/components/parameters/XrfKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReloadTask'
      responses:
        '201':
          description: Reload task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReloadTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /reloadtask/{id}:
    get:
      operationId: getReloadTask
      summary: Qlik Sense Enterprise Get reload task by ID
      description: Retrieves a single reload task by its unique identifier.
      tags:
      - Reload Task
      parameters:
      - $ref: '#/components/parameters/XrfKeyParam'
      - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Reload task returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReloadTask'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateReloadTask
      summary: Qlik Sense Enterprise Update reload task
      description: Updates an existing reload task configuration.
      tags:
      - Reload Task
      parameters:
      - $ref: '#/components/parameters/XrfKeyParam'
      - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReloadTask'
      responses:
        '200':
          description: Reload task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReloadTask'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteReloadTask
      summary: Qlik Sense Enterprise Delete reload task
      description: Permanently deletes a reload task.
      tags:
      - Reload Task
      parameters:
      - $ref: '#/components/parameters/XrfKeyParam'
      - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Reload task deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  responses:
    Unauthorized:
      description: Authentication failed. The request lacks valid authentication credentials or the Xrfkey header/parameter is missing or mismatched.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested entity was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid request. The request body or parameters are malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    PrivilegesParam:
      name: privileges
      in: query
      required: false
      description: Whether to append privilege information to the returned entities.
      schema:
        type: boolean
        default: false
    XrfKeyParam:
      name: Xrfkey
      in: query
      required: true
      description: Cross-site request forgery prevention key. Must be 16 arbitrary characters matching the X-Qlik-Xrfkey header value.
      schema:
        type: string
        minLength: 16
        maxLength: 16
    FilterParam:
      name: filter
      in: query
      required: false
      description: 'Filter expression using the syntax: property operator value. Supports operators like eq, ne, so, ew, sw. Example: name eq ''MyApp'''
      schema:
        type: string
    IdParam:
      name: id
      in: path
      required: true
      description: Unique identifier (GUID) of the entity
      schema:
        type: string
        format: uuid
  schemas:
    CustomPropertyCondensed:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        valueType:
          type: string
        privileges:
          type: array
          items:
            type: string
    CustomPropertyValue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdDate:
          type: string
          format: date-time
        modifiedDate:
          type: string
          format: date-time
        modifiedByUserName:
          type: string
        definition:
          $ref: '#/components/schemas/CustomPropertyCondensed'
        value:
          type: string
        schemaPath:
          type: string
    TagCondensed:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        privileges:
          type: array
          items:
            type: string
    AppCondensed:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        appId:
          type: string
        publishTime:
          type: string
          format: date-time
        published:
          type: boolean
        stream:
          $ref: '#/components/schemas/StreamCondensed'
        savedInProductVersion:
          type: string
        migrationHash:
          type: string
        availabilityStatus:
          type: integer
        privileges:
          type: array
          items:
            type: string
    ReloadTaskCondensed:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        taskType:
          type: integer
        enabled:
          type: boolean
        privileges:
          type: array
          items:
            type: string
    Error:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error message
    StreamCondensed:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        privileges:
          type: array
          items:
            type: string
    ReloadTask:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdDate:
          type: string
          format: date-time
        modifiedDate:
          type: string
          format: date-time
        modifiedByUserName:
          type: string
        name:
          type: string
          description: Reload task name
        taskType:
          type: integer
          description: Task type identifier
        enabled:
          type: boolean
          description: Whether the task is enabled
        taskSessionTimeout:
          type: integer
          description: Task session timeout in minutes
        maxRetries:
          type: integer
          description: Maximum number of retry attempts on failure
        app:
          $ref: '#/components/schemas/AppCondensed'
        isManuallyTriggered:
          type: boolean
          description: Whether the task requires manual triggering
        operational:
          type: object
          properties:
            id:
              type: string
              format: uuid
            lastExecutionResult:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                executingNodeName:
                  type: string
                status:
                  type: integer
                  description: Execution status (0=NeverStarted, 1=Triggered, 2=Started, 3=Queued, 4=AbortInitiated, 5=Aborting, 6=Aborted, 7=FinishedSuccess, 8=FinishedFail, 9=Skipped, 10=Retry, 11=Error, 12=Reset)
                startTime:
                  type: string
                  format: date-time
                stopTime:
                  type: string
                  format: date-time
                duration:
                  type: integer
                  description: Execution duration in milliseconds
            nextExecution:
              type: string
              format: date-time
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagCondensed'
        customProperties:
          type: array
          items:
            $ref: '#/components/schemas/CustomPropertyValue'
        privileges:
          type: array
          items:
            type: string
        schemaPath:
          type: string
      required:
      - name
  securitySchemes:
    xrfkey:
      type: apiKey
      in: header
      name: X-Qlik-Xrfkey
      description: Cross-site request forgery prevention key. Must be 16 arbitrary characters and must match the Xrfkey query parameter.
