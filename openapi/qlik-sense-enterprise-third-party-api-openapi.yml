openapi: 3.1.0
info:
  title: Qlik Sense Enterprise Qlik Sense Service About Third Party API
  description: REST API for retrieving product information about a Qlik Sense site, including system details, installed components, external URLs, and third-party software information. The About Service API provides read-only endpoints that return JSON-formatted information about the Qlik Sense deployment.
  version: 2025.11.0
  contact:
    name: Qlik Support
    url: https://community.qlik.com/
  license:
    name: Proprietary
    url: https://www.qlik.com/us/legal/terms-of-use
  x-providerName: Qlik
  x-serviceName: qlik-sense-about-service
servers:
- url: https://{server}/api/about/v1
  description: About Service API via HTTPS
  variables:
    server:
      default: localhost
      description: Qlik Sense server hostname
security:
- xrfkey: []
tags:
- name: Third Party
  description: Retrieve third-party software information
paths:
  /thirdparty:
    get:
      operationId: getThirdPartyInfo
      summary: Qlik Sense Enterprise Get third-party software information
      description: Retrieves information about third-party software components included in the Qlik Sense installation, including their names, versions, and license information.
      tags:
      - Third Party
      parameters:
      - $ref: '#/components/parameters/XrfKeyParam'
      responses:
        '200':
          description: Third-party information returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ThirdPartySoftware'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    ThirdPartySoftware:
      type: object
      properties:
        name:
          type: string
          description: Name of the third-party software
        version:
          type: string
          description: Version of the third-party software
        license:
          type: string
          description: License type or identifier
        url:
          type: string
          format: uri
          description: URL for the third-party software project or license
    Error:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error message
  responses:
    Unauthorized:
      description: Authentication failed or Xrfkey missing/mismatched.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    XrfKeyParam:
      name: Xrfkey
      in: query
      required: true
      description: Cross-site request forgery prevention key. Must be 16 arbitrary characters matching the X-Qlik-Xrfkey header value.
      schema:
        type: string
        minLength: 16
        maxLength: 16
  securitySchemes:
    xrfkey:
      type: apiKey
      in: header
      name: X-Qlik-Xrfkey
      description: Cross-site request forgery prevention key. Must be 16 arbitrary characters and must match the Xrfkey query parameter.
