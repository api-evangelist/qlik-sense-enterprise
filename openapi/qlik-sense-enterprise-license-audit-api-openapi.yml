openapi: 3.1.0
info:
  title: Qlik Sense Enterprise Qlik Sense Service About License Audit API
  description: REST API for retrieving product information about a Qlik Sense site, including system details, installed components, external URLs, and third-party software information. The About Service API provides read-only endpoints that return JSON-formatted information about the Qlik Sense deployment.
  version: 2025.11.0
  contact:
    name: Qlik Support
    url: https://community.qlik.com/
  license:
    name: Proprietary
    url: https://www.qlik.com/us/legal/terms-of-use
  x-providerName: Qlik
  x-serviceName: qlik-sense-about-service
servers:
- url: https://{server}/api/about/v1
  description: About Service API via HTTPS
  variables:
    server:
      default: localhost
      description: Qlik Sense server hostname
security:
- xrfkey: []
tags:
- name: License Audit
  description: Audit license rule evaluations and access type assignments
paths:
  /licenserule/audit:
    post:
      operationId: auditLicenseRules
      summary: Qlik Sense Enterprise Audit license rules
      description: Evaluates license rules to determine which access types would be assigned to users based on the current rule configuration.
      tags:
      - License Audit
      parameters:
      - $ref: '#/components/parameters/XrfKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicenseAuditRequest'
      responses:
        '200':
          description: License rule audit results returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseAuditResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  responses:
    Unauthorized:
      description: Authentication failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    LicenseAuditRequest:
      type: object
      properties:
        resourceType:
          type: string
          description: Type of resource to audit
        resourceFilter:
          type: string
          description: Filter for resources
        userFilter:
          type: string
          description: Filter for users
    Error:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error message
    LicenseAuditResult:
      type: object
      properties:
        matrix:
          type: array
          items:
            type: object
          description: Audit result matrix showing rule evaluations
        schemaPath:
          type: string
  parameters:
    XrfKeyParam:
      name: Xrfkey
      in: query
      required: true
      description: Cross-site request forgery prevention key matching the X-Qlik-Xrfkey header.
      schema:
        type: string
        minLength: 16
        maxLength: 16
  securitySchemes:
    xrfkey:
      type: apiKey
      in: header
      name: X-Qlik-Xrfkey
      description: Cross-site request forgery prevention key. Must be 16 arbitrary characters and must match the Xrfkey query parameter.
